<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <!-- PLACEHOLDER ARTWORK — "The Midnight Express" (mystery). Replace with final illustration. -->
  <defs>
    <linearGradient id="me-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1730"/>
      <stop offset="55%" stop-color="#07101f"/>
      <stop offset="100%" stop-color="#040810"/>
    </linearGradient>
    <radialGradient id="me-lamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffcf8a" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#ff9f45" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ff9f45" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="me-train" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7d1a22"/>
      <stop offset="40%" stop-color="#a52630"/>
      <stop offset="100%" stop-color="#4a0f16"/>
    </linearGradient>
    <linearGradient id="me-floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#121d2e"/>
      <stop offset="100%" stop-color="#060b14"/>
    </linearGradient>
    <linearGradient id="me-reflect" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffb968" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#ffb968" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="me-vignette" cx="0.5" cy="0.44" r="0.72">
      <stop offset="55%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.62"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#me-sky)"/>

  <!-- station roof structure -->
  <rect x="0" y="0" width="1200" height="120" fill="#050a13"/>
  <g fill="#0a1322">
    <rect x="120" y="120" width="26" height="420"/>
    <rect x="430" y="120" width="22" height="400"/>
    <rect x="980" y="120" width="24" height="440"/>
  </g>

  <!-- overhead lamps -->
  <circle cx="255" cy="150" r="180" fill="url(#me-lamp)"/>
  <circle cx="880" cy="175" r="150" fill="url(#me-lamp)" opacity="0.75"/>
  <circle cx="255" cy="150" r="13" fill="#ffe0b0"/>
  <circle cx="880" cy="175" r="10" fill="#ffe0b0"/>

  <!-- distant tunnel haze -->
  <ellipse cx="1080" cy="500" rx="240" ry="170" fill="#1b2a4a" opacity="0.5"/>

  <!-- train body, receding to the right -->
  <path d="M-40 300 L760 372 L760 640 L-40 640 Z" fill="url(#me-train)"/>
  <path d="M-40 300 L760 372 L760 406 L-40 336 Z" fill="#c33a44" opacity="0.65"/>
  <path d="M-40 596 L760 606 L760 640 L-40 640 Z" fill="#2b070c"/>

  <!-- lit windows -->
  <g fill="#ffc27a">
    <rect x="20" y="372" width="118" height="96" rx="12" opacity="0.95"/>
    <rect x="176" y="386" width="118" height="94" rx="12" opacity="0.9"/>
    <rect x="332" y="400" width="112" height="92" rx="12" opacity="0.82"/>
    <rect x="482" y="414" width="104" height="88" rx="12" opacity="0.7"/>
    <rect x="624" y="428" width="94" height="84" rx="12" opacity="0.55"/>
  </g>
  <!-- silhouettes inside the carriage -->
  <g fill="#5c1c14" opacity="0.85">
    <circle cx="70" cy="416" r="24"/><rect x="44" y="440" width="52" height="34" rx="14"/>
    <circle cx="232" cy="430" r="22"/><rect x="208" y="452" width="48" height="30" rx="13"/>
    <circle cx="520" cy="456" r="18"/><rect x="500" y="474" width="40" height="26" rx="11"/>
  </g>

  <!-- roof line + undercarriage -->
  <path d="M-40 288 L762 362 L762 376 L-40 302 Z" fill="#e0616c" opacity="0.35"/>
  <g fill="#08101c">
    <rect x="60" y="640" width="150" height="46" rx="14"/>
    <rect x="330" y="642" width="150" height="44" rx="14"/>
    <rect x="600" y="644" width="140" height="42" rx="14"/>
  </g>

  <!-- platform -->
  <rect x="0" y="686" width="1200" height="214" fill="url(#me-floor)"/>
  <rect x="0" y="686" width="1200" height="6" fill="#f2b46a" opacity="0.35"/>
  <g fill="url(#me-reflect)">
    <rect x="30" y="692" width="120" height="200"/>
    <rect x="190" y="692" width="110" height="180"/>
    <rect x="352" y="692" width="96" height="160"/>
    <rect x="880" y="692" width="70" height="150"/>
  </g>

  <!-- lone figure on the platform -->
  <g fill="#04070d">
    <ellipse cx="905" cy="712" rx="52" ry="10" opacity="0.7"/>
    <path d="M886 712 L886 606 C886 578 924 578 924 606 L924 712 Z"/>
    <circle cx="905" cy="576" r="22"/>
    <path d="M872 640 L872 596 L884 596 L884 648 Z"/>
    <path d="M938 640 L938 596 L926 596 L926 648 Z"/>
  </g>
  <ellipse cx="905" cy="600" rx="120" ry="140" fill="#ffb968" opacity="0.06"/>

  <!-- drifting steam -->
  <g fill="#8fa8cc" opacity="0.12">
    <ellipse cx="1010" cy="640" rx="180" ry="70"/>
    <ellipse cx="760" cy="690" rx="150" ry="46"/>
  </g>

  <rect width="1200" height="900" fill="url(#me-vignette)"/>
</svg>
