<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <!-- PLACEHOLDER ARTWORK — "Neon Rain" (sci-fi). Replace with final illustration. -->
  <defs>
    <linearGradient id="nr-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#120a2e"/>
      <stop offset="50%" stop-color="#1b0f3a"/>
      <stop offset="100%" stop-color="#060418"/>
    </linearGradient>
    <linearGradient id="nr-road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#160e33"/>
      <stop offset="100%" stop-color="#05030f"/>
    </linearGradient>
    <linearGradient id="nr-magenta" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff3fa4" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#ff3fa4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="nr-cyan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3fe8ff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#3fe8ff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="nr-halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ff5cb8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ff5cb8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nr-halo2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#59e9ff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#59e9ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nr-vignette" cx="0.5" cy="0.46" r="0.7">
      <stop offset="46%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.7"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#nr-sky)"/>

  <!-- distant towers -->
  <g fill="#0d0827">
    <rect x="40" y="180" width="120" height="500"/><rect x="190" y="120" width="90" height="560"/>
    <rect x="300" y="240" width="110" height="440"/><rect x="820" y="150" width="130" height="530"/>
    <rect x="980" y="220" width="100" height="460"/><rect x="1100" y="110" width="110" height="570"/>
  </g>
  <g fill="#5a4bd6" opacity="0.5">
    <rect x="62" y="212" width="12" height="16"/><rect x="94" y="256" width="12" height="16"/>
    <rect x="212" y="180" width="12" height="16"/><rect x="244" y="300" width="12" height="16"/>
    <rect x="326" y="288" width="12" height="16"/><rect x="850" y="196" width="12" height="16"/>
    <rect x="892" y="330" width="12" height="16"/><rect x="1010" y="264" width="12" height="16"/>
    <rect x="1130" y="176" width="12" height="16"/><rect x="1164" y="320" width="12" height="16"/>
  </g>

  <!-- street canyon walls -->
  <path d="M0 900 L0 60 L330 210 L330 900 Z" fill="#070419"/>
  <path d="M1200 900 L1200 40 L860 200 L860 900 Z" fill="#070419"/>

  <!-- neon signage, left wall -->
  <circle cx="250" cy="330" r="200" fill="url(#nr-halo)"/>
  <g fill="#ff3fa4">
    <rect x="196" y="250" width="120" height="16" rx="8"/>
    <rect x="196" y="284" width="86" height="12" rx="6"/>
    <rect x="196" y="316" width="104" height="12" rx="6"/>
  </g>
  <rect x="176" y="230" width="14" height="200" rx="7" fill="#ff3fa4"/>
  <rect x="176" y="230" width="14" height="200" rx="7" fill="url(#nr-magenta)"/>

  <!-- neon signage, right wall -->
  <circle cx="930" cy="420" r="190" fill="url(#nr-halo2)"/>
  <g fill="#3fe8ff">
    <rect x="890" y="340" width="130" height="14" rx="7"/>
    <rect x="890" y="372" width="94" height="11" rx="5"/>
    <rect x="890" y="400" width="112" height="11" rx="5"/>
  </g>
  <rect x="1030" y="320" width="12" height="180" rx="6" fill="#3fe8ff"/>
  <rect x="1030" y="320" width="12" height="180" rx="6" fill="url(#nr-cyan)"/>

  <!-- hanging lanterns across the street -->
  <g>
    <path d="M330 260 Q600 340 860 250" stroke="#1b1140" stroke-width="4" fill="none"/>
    <circle cx="440" cy="300" r="12" fill="#ffb35c"/><circle cx="440" cy="300" r="34" fill="#ffb35c" opacity="0.25"/>
    <circle cx="600" cy="322" r="12" fill="#ff6f9c"/><circle cx="600" cy="322" r="34" fill="#ff6f9c" opacity="0.25"/>
    <circle cx="760" cy="298" r="12" fill="#7cc9ff"/><circle cx="760" cy="298" r="34" fill="#7cc9ff" opacity="0.25"/>
  </g>

  <!-- wet street -->
  <rect x="0" y="660" width="1200" height="240" fill="url(#nr-road)"/>
  <g opacity="0.6">
    <rect x="150" y="666" width="140" height="234" fill="url(#nr-magenta)" opacity="0.5"/>
    <rect x="880" y="666" width="130" height="234" fill="url(#nr-cyan)" opacity="0.45"/>
    <rect x="420" y="666" width="60" height="200" fill="#ffb35c" opacity="0.16"/>
    <rect x="740" y="666" width="54" height="190" fill="#7cc9ff" opacity="0.16"/>
  </g>

  <!-- lone figure with umbrella -->
  <g fill="#04020e">
    <path d="M578 850 L578 690 C578 668 622 668 622 690 L622 850 Z"/>
    <circle cx="600" cy="660" r="24"/>
    <rect x="596" y="540" width="8" height="150" rx="4"/>
    <path d="M486 560 C486 486 714 486 714 560 C664 528 536 528 486 560 Z"/>
  </g>
  <ellipse cx="600" cy="866" rx="110" ry="14" fill="#ff5cb8" opacity="0.18"/>

  <!-- rain -->
  <g stroke="#bcd7ff" stroke-width="2" opacity="0.2" stroke-linecap="round">
    <line x1="90" y1="60" x2="72" y2="180"/><line x1="230" y1="20" x2="212" y2="140"/>
    <line x1="380" y1="90" x2="362" y2="210"/><line x1="520" y1="40" x2="502" y2="160"/>
    <line x1="670" y1="110" x2="652" y2="230"/><line x1="810" y1="30" x2="792" y2="150"/>
    <line x1="960" y1="80" x2="942" y2="200"/><line x1="1110" y1="50" x2="1092" y2="170"/>
    <line x1="160" y1="330" x2="142" y2="450"/><line x1="460" y1="380" x2="442" y2="500"/>
    <line x1="760" y1="420" x2="742" y2="540"/><line x1="1040" y1="360" x2="1022" y2="480"/>
  </g>

  <rect width="1200" height="900" fill="url(#nr-vignette)"/>
</svg>
