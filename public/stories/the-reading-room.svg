<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <!-- PLACEHOLDER ARTWORK — "The Reading Room" (historical). Replace with final illustration. -->
  <defs>
    <linearGradient id="rr-room" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2e1a0d"/>
      <stop offset="60%" stop-color="#1a0f08"/>
      <stop offset="100%" stop-color="#0c0704"/>
    </linearGradient>
    <radialGradient id="rr-lamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffe6b8" stop-opacity="0.95"/>
      <stop offset="34%" stop-color="#ffab45" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#ff9020" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rr-window" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4d5fa8"/>
      <stop offset="100%" stop-color="#141c3d"/>
    </linearGradient>
    <linearGradient id="rr-moonbeam" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#b9c9ff" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#b9c9ff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="rr-vignette" cx="0.5" cy="0.5" r="0.7">
      <stop offset="44%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.74"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#rr-room)"/>

  <!-- arched window with moonlight -->
  <path d="M760 420 L760 190 A110 110 0 0 1 980 190 L980 420 Z" fill="url(#rr-window)"/>
  <g stroke="#100903" stroke-width="12" fill="none">
    <path d="M870 84 L870 420"/><path d="M760 250 L980 250"/><path d="M760 340 L980 340"/>
  </g>
  <path d="M760 420 L980 420 L1140 900 L560 900 Z" fill="url(#rr-moonbeam)"/>
  <circle cx="906" cy="180" r="34" fill="#e8ecff" opacity="0.85"/>

  <!-- bookshelves, left and back -->
  <g fill="#160c06">
    <rect x="0" y="60" width="420" height="720"/>
  </g>
  <g fill="#3a2211">
    <rect x="24" y="120" width="372" height="12"/><rect x="24" y="260" width="372" height="12"/>
    <rect x="24" y="400" width="372" height="12"/><rect x="24" y="540" width="372" height="12"/>
    <rect x="24" y="680" width="372" height="12"/>
  </g>
  <g>
    <g fill="#7a3b26"><rect x="40" y="52" width="22" height="68"/><rect x="128" y="46" width="26" height="74"/><rect x="252" y="56" width="20" height="64"/></g>
    <g fill="#8a5a2a"><rect x="68" y="60" width="18" height="60"/><rect x="160" y="52" width="22" height="68"/><rect x="300" y="48" width="24" height="72"/></g>
    <g fill="#5c3a6b"><rect x="92" y="44" width="20" height="76"/><rect x="212" y="58" width="22" height="62"/><rect x="342" y="56" width="20" height="64"/></g>

    <g fill="#7a3b26"><rect x="44" y="192" width="24" height="68"/><rect x="150" y="186" width="22" height="74"/><rect x="288" y="196" width="20" height="64"/></g>
    <g fill="#8a5a2a"><rect x="76" y="200" width="20" height="60"/><rect x="186" y="192" width="24" height="68"/><rect x="322" y="188" width="22" height="72"/></g>
    <g fill="#4a6b5c"><rect x="104" y="184" width="22" height="76"/><rect x="230" y="198" width="20" height="62"/><rect x="356" y="196" width="20" height="64"/></g>

    <g fill="#7a3b26"><rect x="36" y="336" width="22" height="64"/><rect x="164" y="330" width="24" height="70"/><rect x="296" y="338" width="20" height="62"/></g>
    <g fill="#8a5a2a"><rect x="66" y="344" width="20" height="56"/><rect x="200" y="336" width="22" height="64"/><rect x="330" y="330" width="24" height="70"/></g>
    <g fill="#5c3a6b"><rect x="96" y="328" width="22" height="72"/><rect x="240" y="342" width="20" height="58"/><rect x="366" y="340" width="18" height="60"/></g>

    <g fill="#7a3b26" opacity="0.75"><rect x="48" y="480" width="24" height="60"/><rect x="176" y="474" width="22" height="66"/><rect x="308" y="482" width="20" height="58"/></g>
    <g fill="#8a5a2a" opacity="0.75"><rect x="82" y="486" width="20" height="54"/><rect x="212" y="478" width="24" height="62"/><rect x="342" y="476" width="22" height="64"/></g>
  </g>

  <!-- desk -->
  <rect x="440" y="640" width="660" height="26" rx="8" fill="#6b4020"/>
  <rect x="440" y="666" width="660" height="18" fill="#33190a"/>
  <rect x="500" y="684" width="30" height="216" fill="#2a1408"/>
  <rect x="1010" y="684" width="30" height="216" fill="#2a1408"/>

  <!-- desk lamp -->
  <circle cx="978" cy="560" r="230" fill="url(#rr-lamp)"/>
  <g fill="#1c0f06">
    <rect x="972" y="520" width="10" height="120"/>
    <path d="M930 520 L1026 520 L1002 470 L954 470 Z"/>
    <ellipse cx="978" cy="640" rx="46" ry="10"/>
  </g>
  <ellipse cx="978" cy="518" rx="40" ry="10" fill="#ffe6b8"/>

  <!-- open book + reader -->
  <path d="M596 640 L718 626 L720 640 L596 654 Z" fill="#e9dcc0"/>
  <path d="M718 626 L840 640 L840 654 L720 640 Z" fill="#d8c8a4"/>
  <g fill="#120a05">
    <path d="M560 900 L560 690 C560 640 620 610 668 610 C716 610 762 644 762 694 L762 900 Z"/>
    <circle cx="662" cy="556" r="62"/>
    <path d="M600 552 C600 494 726 494 726 552 C712 512 614 512 600 552 Z"/>
    <path d="M712 660 L800 636 L806 654 L718 682 Z"/>
  </g>
  <path d="M726 556 C726 604 712 632 686 650 L700 662 C736 638 748 600 744 552 Z" fill="#ffbb62" opacity="0.55"/>

  <!-- dust motes -->
  <g fill="#ffd9a0" opacity="0.5">
    <circle cx="850" cy="470" r="3"/><circle cx="806" cy="386" r="2.4"/><circle cx="900" cy="330" r="2.6"/>
    <circle cx="760" cy="520" r="2.2"/><circle cx="960" cy="400" r="2.8"/>
  </g>

  <rect width="1200" height="900" fill="url(#rr-vignette)"/>
</svg>
