<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <!-- PLACEHOLDER ARTWORK — "House on the Hill" (gothic). Replace with final illustration. -->
  <defs>
    <linearGradient id="hh-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e1734"/>
      <stop offset="52%" stop-color="#16204a"/>
      <stop offset="100%" stop-color="#050818"/>
    </linearGradient>
    <radialGradient id="hh-moon" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#e6eeff" stop-opacity="0.95"/>
      <stop offset="22%" stop-color="#a9c0ff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#6f8bff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hh-hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1230"/>
      <stop offset="100%" stop-color="#03050f"/>
    </linearGradient>
    <radialGradient id="hh-vignette" cx="0.5" cy="0.46" r="0.72">
      <stop offset="48%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.72"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#hh-sky)"/>

  <!-- stars -->
  <g fill="#dce6ff">
    <circle cx="150" cy="90" r="2" opacity="0.7"/><circle cx="380" cy="140" r="1.6" opacity="0.5"/>
    <circle cx="620" cy="60" r="2.2" opacity="0.75"/><circle cx="1080" cy="120" r="1.8" opacity="0.6"/>
    <circle cx="920" cy="200" r="1.5" opacity="0.45"/><circle cx="260" cy="230" r="1.7" opacity="0.5"/>
  </g>

  <!-- moon behind the house -->
  <circle cx="740" cy="250" r="260" fill="url(#hh-moon)" opacity="0.7"/>
  <circle cx="740" cy="250" r="92" fill="#eaf0ff"/>
  <circle cx="712" cy="232" r="16" fill="#c8d5f5" opacity="0.6"/>
  <circle cx="768" cy="286" r="22" fill="#c8d5f5" opacity="0.45"/>

  <!-- drifting cloud bands -->
  <g fill="#0a1130" opacity="0.75">
    <ellipse cx="700" cy="214" rx="330" ry="18"/>
    <ellipse cx="520" cy="300" rx="280" ry="14"/>
    <ellipse cx="900" cy="342" rx="300" ry="16"/>
  </g>

  <!-- hill -->
  <path d="M0 900 C180 760 380 700 620 690 C860 680 1040 736 1200 856 L1200 900 Z" fill="url(#hh-hill)"/>

  <!-- the house -->
  <g fill="#040713">
    <rect x="470" y="430" width="290" height="270"/>
    <path d="M450 434 L615 306 L780 434 Z"/>
    <rect x="760" y="500" width="120" height="200"/>
    <path d="M744 504 L820 428 L896 504 Z"/>
    <!-- tower -->
    <rect x="386" y="380" width="86" height="320"/>
    <path d="M370 384 L429 268 L488 384 Z"/>
    <!-- chimney -->
    <rect x="672" y="316" width="34" height="90"/>
    <!-- porch -->
    <rect x="540" y="612" width="150" height="88"/>
    <path d="M524 616 L615 566 L706 616 Z"/>
  </g>

  <!-- lit windows -->
  <g fill="#ffc46a">
    <rect x="510" y="478" width="40" height="56" rx="6" opacity="0.92"/>
    <rect x="586" y="478" width="40" height="56" rx="6" opacity="0.7"/>
    <rect x="666" y="478" width="40" height="56" rx="6" opacity="0.88"/>
    <rect x="796" y="546" width="36" height="50" rx="6" opacity="0.6"/>
    <rect x="410" y="440" width="34" height="48" rx="6" opacity="0.8"/>
    <rect x="592" y="636" width="46" height="64" rx="8" opacity="0.95"/>
  </g>
  <g fill="#ffb347" opacity="0.18">
    <circle cx="530" cy="506" r="70"/><circle cx="686" cy="506" r="66"/><circle cx="615" cy="668" r="90"/>
  </g>
  <!-- a shape at the upper window -->
  <g fill="#3d1f0a" opacity="0.85">
    <circle cx="686" cy="500" r="11"/><rect x="674" y="512" width="24" height="22" rx="8"/>
  </g>

  <!-- bare trees -->
  <g stroke="#03050f" stroke-width="9" fill="none" stroke-linecap="round">
    <path d="M180 900 L200 700 M200 740 L152 672 M200 706 L252 646 M200 780 L146 736"/>
    <path d="M1040 900 L1018 720 M1018 762 L1076 700 M1018 726 L964 668 M1018 800 L1080 758"/>
  </g>
  <g stroke="#03050f" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.8">
    <path d="M310 900 L322 774 M322 802 L286 758 M322 780 L360 742"/>
    <path d="M900 900 L890 782 M890 806 L926 766 M890 786 L854 750"/>
  </g>

  <!-- gate + path -->
  <path d="M560 900 L580 700 L650 700 L672 900 Z" fill="#070b1c"/>
  <g fill="#03050f">
    <rect x="486" y="792" width="10" height="108"/><rect x="516" y="800" width="10" height="100"/>
    <rect x="706" y="800" width="10" height="100"/><rect x="736" y="792" width="10" height="108"/>
    <rect x="470" y="806" width="80" height="9"/><rect x="690" y="806" width="80" height="9"/>
  </g>

  <!-- mist -->
  <g fill="#8fa8ff" opacity="0.1">
    <ellipse cx="420" cy="742" rx="420" ry="42"/>
    <ellipse cx="880" cy="790" rx="400" ry="36"/>
    <ellipse cx="600" cy="850" rx="620" ry="40"/>
  </g>

  <rect width="1200" height="900" fill="url(#hh-vignette)"/>
</svg>
