<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <!-- PLACEHOLDER ARTWORK — "The Last Giant" (fantasy). Replace with final illustration. -->
  <defs>
    <linearGradient id="lg-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1657"/>
      <stop offset="42%" stop-color="#33206f"/>
      <stop offset="72%" stop-color="#5b3a9e"/>
      <stop offset="100%" stop-color="#120b34"/>
    </linearGradient>
    <radialGradient id="lg-moon" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#f6f1ff" stop-opacity="1"/>
      <stop offset="16%" stop-color="#cbbcff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lg-far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a37a0" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1b1250" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="lg-giant" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1246"/>
      <stop offset="100%" stop-color="#07041c"/>
    </linearGradient>
    <radialGradient id="lg-vignette" cx="0.5" cy="0.45" r="0.72">
      <stop offset="52%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.68"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#lg-sky)"/>

  <!-- stars -->
  <g fill="#e6dcff">
    <circle cx="140" cy="86" r="2.4" opacity="0.8"/><circle cx="330" cy="52" r="1.7" opacity="0.55"/>
    <circle cx="520" cy="124" r="2" opacity="0.65"/><circle cx="700" cy="66" r="1.5" opacity="0.5"/>
    <circle cx="1010" cy="104" r="2.2" opacity="0.7"/><circle cx="1140" cy="56" r="1.6" opacity="0.55"/>
    <circle cx="880" cy="38" r="1.8" opacity="0.5"/><circle cx="240" cy="196" r="1.5" opacity="0.45"/>
    <circle cx="1080" cy="230" r="1.6" opacity="0.4"/><circle cx="600" cy="200" r="1.4" opacity="0.35"/>
  </g>

  <!-- moon, high and far to the left, so the giant reads as a clean silhouette -->
  <circle cx="248" cy="216" r="260" fill="url(#lg-moon)" opacity="0.7"/>
  <circle cx="248" cy="216" r="88" fill="#f6f1ff"/>
  <circle cx="278" cy="196" r="70" fill="#33206f" opacity="0.22"/>
  <circle cx="220" cy="252" r="20" fill="#33206f" opacity="0.2"/>

  <!-- thin cloud bands crossing the moon -->
  <g fill="#150e40" opacity="0.55">
    <ellipse cx="300" cy="250" rx="330" ry="13"/>
    <ellipse cx="180" cy="310" rx="260" ry="10"/>
    <ellipse cx="820" cy="190" rx="300" ry="12"/>
  </g>

  <!-- the colossus, right of centre, cut off at the waist by the ridge -->
  <g fill="url(#lg-giant)">
    <!-- torso -->
    <path d="M636 900 L648 466 C652 396 706 356 780 356 C854 356 908 396 912 466 L924 900 Z"/>
    <!-- sloped shoulders -->
    <path d="M618 520 C664 410 896 410 942 520 C880 452 680 452 618 520 Z"/>
    <!-- neck -->
    <rect x="748" y="268" width="64" height="110" rx="26"/>
    <!-- head, small relative to the body -->
    <path d="M738 246 C738 168 822 168 822 246 L822 286 C798 304 762 304 738 286 Z"/>
    <!-- far arm, hanging -->
    <path d="M636 512 L566 792 L620 806 L676 566 Z"/>
    <ellipse cx="594" cy="806" rx="32" ry="24"/>
    <!-- near arm, raised across the sky -->
    <path d="M924 508 L1050 300 L1098 328 L972 542 Z"/>
    <path d="M1036 282 C1070 246 1116 258 1124 296 C1130 322 1104 342 1080 332 Z"/>
  </g>

  <!-- moonlight rim down the giant's left edge -->
  <g fill="#c3b2ff" opacity="0.45">
    <path d="M738 246 C738 186 780 172 780 172 L780 190 C756 198 746 220 746 250 Z"/>
    <path d="M618 520 C664 428 748 414 748 414 L748 432 C686 444 646 480 626 528 Z"/>
    <path d="M640 520 L578 780 L596 786 L660 528 Z" opacity="0.75"/>
  </g>

  <!-- far ridge -->
  <path d="M0 640 L150 556 L272 620 L410 528 L540 612 L660 566 L800 650 L930 582 L1060 654 L1200 590 L1200 900 L0 900 Z" fill="url(#lg-far)"/>

  <!-- castle on the ridge, dwarfed -->
  <g fill="#120c38">
    <rect x="188" y="540" width="30" height="150"/><path d="M188 540 L203 492 L218 540 Z"/>
    <rect x="230" y="568" width="24" height="122"/><path d="M230 568 L242 530 L254 568 Z"/>
    <rect x="164" y="588" width="20" height="102"/><path d="M164 588 L174 558 L184 588 Z"/>
    <rect x="158" y="634" width="104" height="66"/>
  </g>
  <g fill="#ffcf8a" opacity="0.9">
    <rect x="196" y="606" width="8" height="13" rx="3"/>
    <rect x="237" y="622" width="7" height="12" rx="3"/>
    <rect x="184" y="656" width="9" height="15" rx="3"/>
    <rect x="224" y="658" width="9" height="15" rx="3"/>
  </g>

  <!-- near ridge, deepest black -->
  <path d="M0 900 C200 812 380 754 620 762 C860 770 1010 824 1200 792 L1200 900 Z" fill="#050318"/>

  <!-- valley mist -->
  <g fill="#a78bfa" opacity="0.16">
    <ellipse cx="360" cy="712" rx="400" ry="44"/>
    <ellipse cx="900" cy="740" rx="360" ry="38"/>
  </g>

  <!-- tiny traveller on the near ridge, for scale -->
  <g fill="#040218">
    <path d="M420 818 L420 776 C420 765 434 765 434 776 L434 818 Z"/>
    <circle cx="427" cy="763" r="9"/>
    <rect x="440" y="760" width="3" height="60" rx="1.5"/>
  </g>
  <ellipse cx="427" cy="822" rx="40" ry="9" fill="#000" opacity="0.55"/>

  <rect width="1200" height="900" fill="url(#lg-vignette)"/>
</svg>
