<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <!-- PLACEHOLDER ARTWORK — "Salt & Lantern" (adventure). Replace with final illustration. -->
  <defs>
    <linearGradient id="sl-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2b1a55"/>
      <stop offset="38%" stop-color="#6b2f63"/>
      <stop offset="66%" stop-color="#c2543f"/>
      <stop offset="86%" stop-color="#f0894a"/>
      <stop offset="100%" stop-color="#ffb066"/>
    </linearGradient>
    <radialGradient id="sl-sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fff0c9" stop-opacity="1"/>
      <stop offset="30%" stop-color="#ffcf7a" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ff9a4a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sl-sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b8683f"/>
      <stop offset="22%" stop-color="#5c2f5e"/>
      <stop offset="100%" stop-color="#0d0a24"/>
    </linearGradient>
    <linearGradient id="sl-path" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd79a" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffb066" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="sl-vignette" cx="0.5" cy="0.48" r="0.72">
      <stop offset="52%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.6"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#sl-sky)"/>

  <!-- clouds -->
  <g fill="#3a1f4e" opacity="0.55">
    <ellipse cx="260" cy="150" rx="260" ry="30"/>
    <ellipse cx="880" cy="110" rx="230" ry="24"/>
    <ellipse cx="620" cy="230" rx="300" ry="22"/>
    <ellipse cx="1050" cy="270" rx="220" ry="18"/>
  </g>
  <g fill="#ffb98a" opacity="0.28">
    <ellipse cx="320" cy="330" rx="280" ry="16"/>
    <ellipse cx="860" cy="360" rx="240" ry="14"/>
  </g>

  <!-- sun -->
  <circle cx="700" cy="500" r="290" fill="url(#sl-sun)"/>
  <circle cx="700" cy="500" r="86" fill="#fff2d2"/>

  <!-- horizon + sea -->
  <rect x="0" y="500" width="1200" height="400" fill="url(#sl-sea)"/>
  <path d="M600 500 L800 500 L960 900 L440 900 Z" fill="url(#sl-path)" opacity="0.5"/>
  <g fill="#ffe0b0" opacity="0.5">
    <rect x="560" y="536" width="280" height="5" rx="2"/>
    <rect x="520" y="578" width="360" height="6" rx="3"/>
    <rect x="470" y="628" width="440" height="7" rx="3"/>
    <rect x="410" y="690" width="540" height="8" rx="4"/>
    <rect x="330" y="766" width="660" height="9" rx="4"/>
    <rect x="240" y="852" width="800" height="10" rx="5"/>
  </g>
  <g fill="#1a1136" opacity="0.55">
    <rect x="60" y="560" width="300" height="6" rx="3"/>
    <rect x="900" y="600" width="280" height="7" rx="3"/>
    <rect x="40" y="672" width="330" height="8" rx="4"/>
    <rect x="880" y="734" width="320" height="9" rx="4"/>
  </g>

  <!-- headland cliff on the left -->
  <path d="M-40 900 L-40 340 L60 300 L150 380 L210 356 L280 470 L330 520 L370 900 Z" fill="#140d2c"/>
  <path d="M-40 340 L60 300 L150 380 L210 356 L232 400 L-40 400 Z" fill="#241748" opacity="0.7"/>
  <!-- lighthouse -->
  <g fill="#0c0722">
    <path d="M96 300 L120 300 L128 220 L88 220 Z"/>
    <rect x="84" y="196" width="48" height="26" rx="6"/>
  </g>
  <circle cx="108" cy="208" r="9" fill="#fff0c9"/>
  <circle cx="108" cy="208" r="46" fill="#ffcf7a" opacity="0.3"/>

  <!-- small sailing boat -->
  <g fill="#100a24">
    <path d="M596 704 L716 704 L688 748 L624 748 Z"/>
    <rect x="652" y="596" width="7" height="110"/>
    <path d="M659 600 L730 700 L659 700 Z"/>
    <path d="M652 612 L590 700 L652 700 Z"/>
  </g>
  <ellipse cx="656" cy="756" rx="86" ry="10" fill="#ffcf7a" opacity="0.32"/>

  <!-- gulls -->
  <g stroke="#150e2e" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M300 220 q16 -14 32 0 q16 -14 32 0"/>
    <path d="M420 168 q12 -11 24 0 q12 -11 24 0" opacity="0.7"/>
    <path d="M980 200 q14 -12 28 0 q14 -12 28 0" opacity="0.55"/>
  </g>

  <rect width="1200" height="900" fill="url(#sl-vignette)"/>
</svg>
